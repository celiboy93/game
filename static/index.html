<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Game Shop</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: #222; padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; border: 1px solid #ffd700; max-height: 80vh; overflow-y: auto; }
        .history-item { background: #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #0f0; }
        .code-text { background: #000; color: #0f0; padding: 5px; margin-top: 5px; font-family: monospace; display: block; text-align: center; border-radius: 3px; }
        .close-btn { background: #d32f2f; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">💎 MY SHOP</div>
        <div class="balance" id="userBalance">Loading...</div>
    </header>

    <div class="categories">
        <button class="active" onclick="filterItems('all')">All</button>
        <button onclick="filterItems('ml')">MLBB</button>
        <button onclick="filterItems('pubg')">PUBG</button>
        <button onclick="filterItems('netflix')">Netflix</button>
        <button onclick="showHistory()" style="background: #2196F3; color: white;">History</button>
        <button onclick="location.href='/api/auth/logout'" style="background:#d32f2f; color:white;">Logout</button>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #ffd700; text-align: center; margin-top: 0;">MY ORDERS</h2>
            <div id="historyList">Loading...</div>
            <button class="close-btn" onclick="closeHistory()">CLOSE</button>
        </div>
    </div>

    <script>
        let allItems = [];

        async function init() {
            const userRes = await fetch('/api/me');
            if(userRes.ok) {
                const user = await userRes.json();
                
                document.getElementById('userBalance').innerHTML = 
                    `${user.username.toUpperCase()} | <span style="color:#0f0">${user.balance} MMK</span>`;

                // SHOW ADMIN BUTTON IF USER IS ADMIN
                if(user.username === "admin") {
                    const nav = document.querySelector('.categories');
                    nav.insertAdjacentHTML('beforeend', 
                        `<button onclick="location.href='/admin'" style="background:red; color:white; border:1px solid white;">ADMIN</button>`
                    );
                }

            } else {
                location.href = '/login';
            }

            const itemRes = await fetch('/api/items');
            allItems = await itemRes.json();
            renderItems(allItems);
        }

        function renderItems(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const isOutOfStock = item.stock.length === 0;
                let bgClass = 'ml';
                if(item.category === 'pubg') bgClass = 'pubg';
                if(item.category === 'netflix') bgClass = 'nf';

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="img-box ${bgClass}">${item.category.toUpperCase()}</div>
                    <div class="info">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price}</p>
                        <p style="font-size:12px; color:${isOutOfStock ? 'red':'#0f0'}">Stock: ${item.stock.length}</p>
                        <button onclick="buyItem('${item.name}')" ${isOutOfStock ? 'disabled':''}>
                            ${isOutOfStock ? "OUT OF STOCK" : "BUY NOW"}
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function filterItems(cat) {
            if(cat === 'all') renderItems(allItems);
            else renderItems(allItems.filter(i => i.category === cat));
        }

        async function buyItem(name) {
            if(!confirm(`Buy ${name}?`)) return;

            const res = await fetch('/api/buy', {
                method: 'POST',
                body: JSON.stringify({ itemName: name })
            });
            const result = await res.json();

            if(result.success) {
                alert(`SUCCESS!\nCode: ${result.code}\n\n(Saved to History)`);
                init(); 
            } else {
                alert(`FAILED: ${result.error}`);
            }
        }

        async function showHistory() {
            document.getElementById('historyModal').style.display = 'flex';
            const list = document.getElementById('historyList');
            list.innerHTML = 'Loading...';

            const res = await fetch('/api/history');
            const data = await res.json();

            list.innerHTML = '';
            if(data.length === 0) {
                list.innerHTML = '<p style="text-align:center;">No purchases yet.</p>';
                return;
            }

            data.forEach(record => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <strong>${record.itemName}</strong>
                    <div style="font-size: 12px; color: #ccc;">${record.date}</div>
                    <span class="code-text">${record.code}</span>
                `;
                list.appendChild(item);
            });
        }

        function closeHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
