<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Game Shop</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <div class="logo">💎 MY SHOP</div>
        <div class="balance" id="userBalance">Loading...</div>
    </header>

    <div class="categories">
        <button class="active" onclick="filterItems('all')">All</button>
        <button onclick="filterItems('ml')">MLBB</button>
        <button onclick="filterItems('pubg')">PUBG</button>
        <button onclick="filterItems('netflix')">Netflix</button>
        <button onclick="location.href='/api/auth/logout'" style="background:#d32f2f; color:white;">Logout</button>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <script>
        let allItems = [];
        let myBalance = 0;

        async function init() {
            // 1. Get User Info
            const userRes = await fetch('/api/me');
            if(userRes.ok) {
                const user = await userRes.json();
                myBalance = user.balance;
                document.getElementById('userBalance').innerHTML = 
                    `${user.username.toUpperCase()} | <span style="color:#0f0">${user.balance} MMK</span>`;
            } else {
                location.href = '/login'; // Force Login
            }

            // 2. Get Items
            const itemRes = await fetch('/api/items');
            allItems = await itemRes.json();
            renderItems(allItems);
        }

        function renderItems(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const isOutOfStock = item.stock.length === 0;
                let bgClass = 'ml';
                if(item.category === 'pubg') bgClass = 'pubg';
                if(item.category === 'netflix') bgClass = 'nf';

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="img-box ${bgClass}">${item.category.toUpperCase()}</div>
                    <div class="info">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price}</p>
                        <p style="font-size:12px; color:${isOutOfStock ? 'red':'#0f0'}">Stock: ${item.stock.length}</p>
                        <button onclick="buyItem('${item.name}')" ${isOutOfStock ? 'disabled':''}>
                            ${isOutOfStock ? "OUT OF STOCK" : "BUY NOW"}
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function filterItems(cat) {
            if(cat === 'all') renderItems(allItems);
            else renderItems(allItems.filter(i => i.category === cat));
        }

        async function buyItem(name) {
            if(!confirm(`Buy ${name}?`)) return;

            const res = await fetch('/api/buy', {
                method: 'POST',
                body: JSON.stringify({ itemName: name })
            });
            const result = await res.json();

            if(result.success) {
                alert(`✅ SUCCESS!\nCode: ${result.code}`);
                init(); // Refresh Balance & Stock
            } else {
                alert(`❌ FAILED: ${result.error}`);
            }
        }

        init();
    </script>
</body>
</html>
