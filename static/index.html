<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Game Shop</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Modals and other styles from previous step */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: #222; padding: 25px; width: 90%; max-width: 400px; border-radius: 10px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .success-box { background: #1a1a1a; border: 2px solid #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); padding: 30px 20px; }
        .success-icon { font-size: 60px; color: #ffd700; margin-bottom: 15px; } /* Gold Icon */
        .code-display { background: #333; color: #fff; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; font-size: 16px; word-break: break-all; border: 1px dashed #555; }
        .copy-btn { background: #2196F3; color: white; border: none; padding: 10px 0; width: 100%; margin-top: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .close-btn { background: #555; color: white; border: none; padding: 10px 0; width: 100%; margin-top: 10px; border-radius: 5px; cursor: pointer; }
        .history-item { background: #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #0f0; }
        .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .inp-field { width: 100%; padding: 10px; margin-bottom: 10px; background: #333; border: 1px solid #555; color: white; box-sizing: border-box; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">💎 MY SHOP</div>
        <div class="balance" id="userBalance" onclick="location.href='/profile'" style="cursor: pointer;">Loading...</div>
    </header>

    <div class="categories">
        <button class="active" onclick="filterItems('all')">All</button>
        <button onclick="filterItems('ml')">MLBB</button>
        <button onclick="filterItems('pubg')">PUBG</button>
        <button onclick="filterItems('netflix')">Netflix</button>
        <button onclick="location.href='/api/auth/logout'" style="background:#d32f2f; color:white;">Logout</button>
    </div>

    <div style="padding: 0 15px; margin-bottom: 10px; display: flex; gap: 10px;">
        <button onclick="openModal('transferModal')" style="background: #673AB7; flex: 1; padding: 10px; border: none; border-radius: 5px; color: white;">Transfer</button>
        <button onclick="openModal('voucherModal')" style="background: #009688; flex: 1; padding: 10px; border: none; border-radius: 5px; color: white;">Redeem</button>
        <button onclick="showHistory()" style="background: #2196F3; flex: 1; padding: 10px; border: none; border-radius: 5px; color: white;">History</button>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <div id="historyModal" class="modal"><div class="modal-content"><h2 style="color: #ffd700; text-align: center; margin-top: 0;">MY ORDERS</h2><div id="historyList">Loading...</div><button class="close-btn" onclick="closeModal('historyModal')">CLOSE</button></div></div>
    <div id="transferModal" class="modal"><div class="modal-content"><h2 style="color: #fff; text-align: center;">TRANSFER MONEY</h2><input type="text" id="tReceiver" class="inp-field" placeholder="Receiver Username"><input type="number" id="tAmount" class="inp-field" placeholder="Amount (MMK)"><button class="action-btn" style="background: #673AB7;" onclick="doTransfer()">SEND NOW</button><button class="close-btn" onclick="closeModal('transferModal')">CANCEL</button></div></div>
    <div id="voucherModal" class="modal"><div class="modal-content"><h2 style="color: #fff; text-align: center;">REDEEM VOUCHER</h2><input type="text" id="vCodeInput" class="inp-field" placeholder="Enter Code (e.g. LUCKY)"><button class="action-btn" style="background: #009688;" onclick="doRedeem()">CLAIM REWARD</button><button class="close-btn" onclick="closeModal('voucherModal')">CANCEL</button></div></div>
    
    <div id="successModal" class="modal">
        <div class="modal-content success-box">
            <div class="success-icon">🎁</div> <h2 style="color: white; margin-top: 0;">PURCHASE SUCCESSFUL!</h2>
            <p style="color: #ccc; font-size: 14px;">Your unique code is ready. It has also been saved to your History.</p>
            <div id="purchasedCodeDisplay" class="code-display"></div>
            <button class="copy-btn" id="copyBtn">COPY CODE</button>
            <button class="close-btn" onclick="closeModal('successModal');">OK</button>
        </div>
    </div>

    <script>
        let allItems = [];

        async function init() {
            const userRes = await fetch('/api/me');
            if(userRes.ok) {
                const user = await userRes.json();
                
                document.getElementById('userBalance').innerHTML = 
                    `${user.username.toUpperCase()} | <span style="color:#0f0">${user.balance} MMK</span>`;

                // SHOW ADMIN BUTTON IF USER IS ADMIN
                if(user.username === "admin") {
                    const nav = document.querySelector('.categories');
                    nav.insertAdjacentHTML('beforeend', 
                        `<button onclick="location.href='/admin'" style="background:red; color:white; border:1px solid white;">ADMIN</button>`
                    );
                }
            } else {
                location.href = '/login';
            }

            const itemRes = await fetch('/api/items');
            allItems = await itemRes.json();
            renderItems(allItems);
        }

        function renderItems(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                 grid.innerHTML = '<p style="color:#888; text-align:center; padding: 30px;">No items in stock. Admin must add new items.</p>';
                 return;
            }

            items.forEach(item => {
                const stockCount = item.stock || 0; 
                const isOutOfStock = stockCount === 0;

                let bgClass = 'ml';
                if(item.category === 'pubg') bgClass = 'pubg';
                if(item.category === 'netflix') bgClass = 'nf';

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="img-box ${bgClass}">${item.category.toUpperCase()}</div>
                    <div class="info">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price}</p>
                        <p style="font-size:12px; color:${isOutOfStock ? 'red':'#0f0'}">Stock: ${stockCount}</p>
                        <button onclick="buyItem('${item.name}')" ${isOutOfStock ? 'disabled':''}>
                            ${isOutOfStock ? "OUT OF STOCK" : "BUY NOW"}
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function filterItems(cat) {
            if(cat === 'all') renderItems(allItems);
            else renderItems(allItems.filter(i => i.category === cat));
        }

        async function buyItem(name) {
            if(!confirm(`Buy ${name}?`)) return;

            const res = await fetch('/api/buy', {
                method: 'POST',
                body: JSON.stringify({ itemName: name })
            });
            const result = await res.json();

            if(result.success) {
                document.getElementById('purchasedCodeDisplay').textContent = result.code;
                openModal('successModal');
                init(); // Refresh Data
            } else {
                alert(`FAILED: ${result.error}`);
            }
        }

        // --- Utility Functions (Transfer/Redeem/History) ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none';
            document.getElementById('tReceiver').value = ''; 
            document.getElementById('tAmount').value = '';
            document.getElementById('vCodeInput').value = '';
        }

        document.getElementById('copyBtn').onclick = () => {
            const code = document.getElementById('purchasedCodeDisplay').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied!');
            });
        };

        async function doTransfer() {
            const receiver = document.getElementById('tReceiver').value;
            const amount = document.getElementById('tAmount').value;
            if(!receiver || !amount) return alert("Fill all fields");

            const res = await fetch('/api/transfer', { method: 'POST', body: JSON.stringify({ receiver, amount }) });
            if(res.ok) { alert("Transfer Successful!"); closeModal('transferModal'); init(); }
            else { 
                const data = await res.text();
                alert("Transfer Failed! Reason: " + data); 
            }
        }

        async function doRedeem() {
            const code = document.getElementById('vCodeInput').value;
            if(!code) return alert("Enter code");

            const res = await fetch('/api/redeem', { method: 'POST', body: JSON.stringify({ code }) });
            if(res.ok) { 
                const data = await res.json();
                alert(`CONGRATS! You received ${data.amount} MMK`); 
                closeModal('voucherModal'); init(); 
            } else { alert("Invalid or Expired Code"); }
        }

        async function showHistory() {
            openModal('historyModal');
            const list = document.getElementById('historyList');
            list.innerHTML = 'Loading...';

            const res = await fetch('/api/history');
            const data = await res.json();

            list.innerHTML = '';
            if(data.length === 0) { list.innerHTML = '<p style="text-align:center;">No purchases yet.</p>'; return; }
            data.forEach(record => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <strong>${record.itemName}</strong><br>
                    <small style="color:#ccc">${record.date}</small>
                    <span class="code-text">${record.code}</span>
                `;
                list.appendChild(item);
            });
        }

        init();
    </script>
</body>
</html>
