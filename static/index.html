<script>
    async function init() {
        const itemRes = await fetch('/api/items');
        const items = await itemRes.json();
        
        // Show raw data on screen to see what the server sent
        document.getElementById('productGrid').innerHTML = 
            '<h2>DEBUG: SERVER DATA</h2><pre>' + JSON.stringify(items, null, 2) + '</pre>';
        
        // Also show balance
        const userRes = await fetch('/api/me');
        const user = await userRes.json();
        document.getElementById('userBalance').innerHTML = `${user.username.toUpperCase()} | ${user.balance} MMK`;
    }
    
    init();
</script>
