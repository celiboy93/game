<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Admin</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input, select, button, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #ffd700; border: none; font-weight: bold; cursor: pointer; }
        .box { background: #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; }
        h2 { color: #ffd700; border-bottom: 1px solid #555; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #555; padding: 8px; text-align: left; vertical-align: top; }
        th { background: #444; }
        .action-btns button { width: auto; padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .delete-btn { background: #d32f2f; color: white; }
        .edit-btn { background: #2196F3; color: white; }
        .full-stock { font-size: 12px; white-space: pre-wrap; background: #222; padding: 5px; border-radius: 3px; }
        
        /* Modal for Editing */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: #333; padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>ADMIN DASHBOARD</h1>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>EDIT ITEM: <span id="editItemName"></span></h2>
            <form id="editForm">
                <input type="hidden" id="editItemId">
                <input type="text" id="editItemPrice" placeholder="Price (e.g. 3500)" required>
                <textarea id="editItemStock" rows="8" placeholder="Codes (one per line)"></textarea>
                <button type="submit" style="background: #4CAF50;">SAVE CHANGES</button>
                <button type="button" onclick="closeEditModal()" class="delete-btn">CANCEL</button>
            </form>
        </div>
    </div>


    <div class="box">
        <h2>USER MANAGEMENT</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="topupUser" placeholder="Username">
            <input type="number" id="topupAmount" placeholder="Amount (MMK)">
            <button onclick="topup()">ADD MONEY</button>
        </div>
        
        <h3>User List</h3>
        <table>
            <thead><tr><th>User</th><th>Balance</th></tr></thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>CREATE VOUCHER</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="vCode" placeholder="Code Name (e.g. LUCKY)">
            <input type="number" id="vAmount" placeholder="Value (MMK)">
            <input type="number" id="vLimit" placeholder="Usage Limit (e.g. 10)">
            <button onclick="createVoucher()">CREATE VOUCHER</button>
        </div>
    </div>

    <div class="box">
        <h2>ADD NEW ITEM</h2>
        <form id="addForm">
            <select id="category">
                <option value="ml">Mobile Legends</option>
                <option value="pubg">PUBG</option>
                <option value="netflix">Netflix</option>
            </select>
            <input type="text" id="name" placeholder="Item Name" required>
            <input type="text" id="price" placeholder="Price (e.g. 3500)" required>
            <textarea id="stock" rows="3" placeholder="Codes (one per line)"></textarea>
            <button type="submit">ADD ITEM</button>
        </form>
    </div>

    <div class="box">
        <h2>CURRENT ITEM STOCK (CRUD)</h2>
        <table id="itemTable">
            <thead>
                <tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        let allAdminItems = []; 

        function openEditModal(itemId, itemName, itemPrice, itemStock) {
            document.getElementById('editItemId').value = itemId;
            document.getElementById('editItemName').textContent = itemName;
            document.getElementById('editItemPrice').value = itemPrice.replace(" MMK", "");
            document.getElementById('editItemStock').value = itemStock.join('\n');
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function loadAdminData() {
            // Load Items (Including full stock)
            const itemRes = await fetch('/api/items');
            allAdminItems = await itemRes.json(); 
            
            const itemTableBody = document.querySelector('#itemTable tbody');
            itemTableBody.innerHTML = '';
            
            allAdminItems.forEach(item => {
                const itemId = item.name.replace(/\s+/g, '_').toLowerCase();
                const stockDisplay = item.stock.length > 0 ? `${item.stock.length} (${item.stock.length * 100}%)` : `0`;

                itemTableBody.innerHTML += `
                    <tr>
                        <td>${item.name} (${item.category.toUpperCase()})</td>
                        <td>${item.price}</td>
                        <td style="color:${item.stock.length > 0 ? '#0F0' : 'red'};">${item.stock.length}</td>
                        <td class="action-btns">
                            <button class="edit-btn" onclick="openEditModal('${itemId}', '${item.name}', '${item.price}', [${item.stock.map(s => \`\\"${s}\\"`).join(',')}] )">Edit</button>
                            <button class="delete-btn" onclick="deleteItem('${itemId}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
            
            // Load Users
            loadUsers();
        }

        async function deleteItem(itemId) {
            if(!confirm("Are you sure you want to delete this item?")) return;

            await fetch('/api/admin/delete-item', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: itemId })
            });
            alert("Item deleted successfully!");
            loadAdminData();
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editItemId').value;
            const price = document.getElementById('editItemPrice').value;
            const stockText = document.getElementById('editItemStock').value;
            
            const originalItem = allAdminItems.find(i => i.name.replace(/\s+/g, '_').toLowerCase() === id);

            if (!originalItem) { alert("Error: Original data not found."); return; }

            const updatedData = {
                ...originalItem,
                price: price + " MMK",
                stock: stockText.split('\n').filter(s => s.trim() !== "")
            };

            await fetch('/api/admin/edit-item', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: id, data: updatedData })
            });

            alert("Item Updated!");
            closeEditModal();
            loadAdminData();
        };

        // --- ADD ITEM LOGIC (CRUCIAL FIX HERE) ---
        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                category: document.getElementById('category').value,
                name: document.getElementById('name').value,
                price: document.getElementById('price').value + " MMK",
                stock: document.getElementById('stock').value.split('\n').filter(s => s.trim() !== "")
            };
            
            try {
                const response = await fetch('/api/add-item', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data) 
                });

                if (response.ok) {
                    alert("Item Added Successfully!");
                } else {
                    const errorText = await response.text();
                    alert(`SERVER ERROR! Status: ${response.status}. Msg: ${errorText}`);
                }
            } catch (networkError) {
                alert("NETWORK ERROR: Server connection failed or timed out.");
            }
            
            e.target.reset(); // Clear form fields
            loadAdminData(); // Refresh list to see item
        };

        // --- Existing Admin Functions ---
        async function loadUsers() { /* ... unchanged ... */ }
        async function topup() { /* ... unchanged ... */ }
        async function createVoucher() { /* ... unchanged ... */ }

        loadAdminData(); // Initial data load
    </script>
</body>
</html>
