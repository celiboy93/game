<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Admin</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        input, select, button, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #ffd700; border: none; font-weight: bold; cursor: pointer; }
        .item-box { background: #333; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #444; }
        h2 { color: #ffd700; border-bottom: 1px solid #555; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h2>ADD NEW ITEM</h2>
    <form id="addForm">
        <label>Category:</label>
        <select id="category">
            <option value="ml">Mobile Legends</option>
            <option value="pubg">PUBG</option>
            <option value="netflix">Netflix</option>
        </select>

        <label>Item Name (e.g., Weekly Pass):</label>
        <input type="text" id="name" required>

        <label>Price (e.g., 3500 MMK):</label>
        <input type="text" id="price" required>

        <label>Stock Data (One code per line):</label>
        <textarea id="stock" rows="5" placeholder="user1:pass1&#10;user2:pass2"></textarea>

        <button type="submit">ADD ITEM</button>
    </form>

    <h2>CURRENT STOCK</h2>
    <div id="stockList">Loading...</div>

    <script>
        async function loadItems() {
            const res = await fetch('/api/items');
            const items = await res.json();
            const list = document.getElementById('stockList');
            list.innerHTML = '';
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-box';
                div.innerHTML = `
                    <strong>${item.name}</strong> (${item.category})<br>
                    Price: ${item.price}<br>
                    Stock Count: <span style="color: #0f0">${item.stock.length}</span>
                `;
                list.appendChild(div);
            });
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                category: document.getElementById('category').value,
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                stock: document.getElementById('stock').value.split('\n').filter(s => s.trim() !== "")
            };

            await fetch('/api/add-item', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            alert("Item Added!");
            loadItems();
            e.target.reset();
        };

        loadItems();
    </script>
</body>
</html>
