<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Admin</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input, select, button, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #ffd700; border: none; font-weight: bold; cursor: pointer; }
        .box { background: #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; }
        h2 { color: #ffd700; border-bottom: 1px solid #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #555; padding: 8px; text-align: left; }
        th { background: #444; }
    </style>
</head>
<body>
    <h1>ADMIN DASHBOARD</h1>

    <div class="box">
        <h2>USER MANAGEMENT</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="topupUser" placeholder="Username">
            <input type="number" id="topupAmount" placeholder="Amount (MMK)">
            <button onclick="topup()">ADD MONEY</button>
        </div>
        
        <h3>User List</h3>
        <table>
            <thead><tr><th>User</th><th>Balance</th></tr></thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>CREATE VOUCHER</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="vCode" placeholder="Code Name (e.g. LUCKY)">
            <input type="number" id="vAmount" placeholder="Value (MMK)">
            <input type="number" id="vLimit" placeholder="Usage Limit (e.g. 10)">
            <button onclick="createVoucher()">CREATE VOUCHER</button>
        </div>
    </div>

    <div class="box">
        <h2>ADD NEW ITEM</h2>
        <form id="addForm">
            <select id="category">
                <option value="ml">Mobile Legends</option>
                <option value="pubg">PUBG</option>
                <option value="netflix">Netflix</option>
            </select>
            <input type="text" id="name" placeholder="Item Name" required>
            <input type="text" id="price" placeholder="Price (e.g. 3500)" required>
            <textarea id="stock" rows="3" placeholder="Codes (one per line)"></textarea>
            <button type="submit">ADD ITEM</button>
        </form>
    </div>

    <script>
        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `<tr><td>${u.username}</td><td style="color:#0f0">${u.balance} MMK</td></tr>`;
            });
        }

        async function topup() {
            const u = document.getElementById('topupUser').value;
            const a = document.getElementById('topupAmount').value;
            if(!u || !a) return alert("Input missing");
            await fetch('/api/admin/topup', { method: 'POST', body: JSON.stringify({ username: u, amount: a }) });
            alert("Topup Successful!");
            loadUsers();
        }

        async function createVoucher() {
            const code = document.getElementById('vCode').value;
            const amount = document.getElementById('vAmount').value;
            const limit = document.getElementById('vLimit').value;
            if(!code || !amount || !limit) return alert("Fill all fields");

            await fetch('/api/admin/create-voucher', {
                method: 'POST',
                body: JSON.stringify({ code, amount, limit })
            });
            alert(`Voucher [${code}] Created! Value: ${amount}`);
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                category: document.getElementById('category').value,
                name: document.getElementById('name').value,
                price: document.getElementById('price').value + " MMK",
                stock: document.getElementById('stock').value.split('\n').filter(s => s.trim() !== "")
            };
            await fetch('/api/add-item', { method: 'POST', body: JSON.stringify(data) });
            alert("Item Added!");
        };

        loadUsers();
    </script>
</body>
</html>
